[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pxf-pipeline"
version = "0.1.0"
description = "AI pixel-art redraw pipeline: on-grid, on-palette and frame-consistent sprite animations, built around the pxf CLI"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow>=9"]

[project.scripts]
pxf-pipeline = "pxf_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["pxf_pipeline*"]

[tool.setuptools.package-data]
pxf_pipeline = ["aseprite/*.lua"]
