[package]
name = "pxf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pixel-forge CLI: zoomed sheets with a known grid, grid-vote downscale, palette conform, masks and remix for AI-edited pixel art"

[[bin]]
name = "pxf"
path = "src/main.rs"

[dependencies]
sprite-formats = { path = "../sprite-formats" }
anyhow.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
spritefusion-pixel-snapper = { git = "https://github.com/Hugo-Dz/spritefusion-pixel-snapper", rev = "ae20461f60fb39e75d15f184bab1ebec1219511c" }
